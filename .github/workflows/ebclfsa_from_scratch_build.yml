name: "EBcLfSA from scratch: Build"
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ebclfsa_aarch64_from_scratch/**
      - ebclfsa_aarch64/config-overlay/**
      - .github/workflows/ebclfsa_from_scratch_build.yml
  workflow_dispatch:
# Building the image takes long, do not keep outdated runs of a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
      - name: Build EBcLfSA image from scratch
        run: |
          bazel build //ebclfsa_aarch64_from_scratch:image //ebclfsa_aarch64_from_scratch:kernel
